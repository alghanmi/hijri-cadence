# Local dev / tests only. Production deploys pass `--name <terraform output
# worker_name>` (hijri-cadence-<instance_id>) so wrangler updates the
# Terraform-managed script that the custom domain routes to.
name = "hijri-cadence"
main = "src/index.ts"
# Owned here: wrangler sets it on every deploy (Terraform no longer does).
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

# Route + custom domain are managed by Terraform (see the module in
# infrastructure/terraform/_modules/hijri-cadence-environment/dns.tf).
# `workers_dev = false` prevents the workers.dev fallback URL from being
# published — production traffic goes through the custom domain only.
workers_dev = false

# ── Build-time string substitution ────────────────────────────────────────────
# wrangler replaces bare identifiers in the bundle at build time. The deploy
# workflow overrides both on production deploys:
#   --define VERSION:'"X.Y.Z"'
#   --define CONFIGS_JSON:"$(printf '%s' "$CONFIGS_JSON" | jq -Rs .)"
# The `jq -Rs .` wraps the raw JSON payload in a valid JS string literal.
# A naive `--define CONFIGS_JSON:'"<raw json>"'` would break because the
# JSON's own double quotes collide with the outer wrapping quotes.
# The values here are the defaults for `wrangler dev` and the test bundle.
# See src/globals.d.ts for the matching TypeScript declarations.
[define]
VERSION = "\"0.0.0-dev\""
CONFIGS_JSON = "\"{}\""

# ── Cron trigger ──────────────────────────────────────────────────────────────
# Owned by Terraform (`cloudflare_workers_cron_trigger` in the module). Do NOT
# add a `[triggers]` table here: `wrangler deploy` PUTs the schedule whenever
# `triggers.crons` is defined, which would override the Terraform-managed
# cron_schedule / cron_enabled on every deploy.

# ── Vars ──────────────────────────────────────────────────────────────────────
# Production vars (INSTANCE_ID, LOG_LEVEL, HEARTBEAT_URL) are passed by the
# deploy as `wrangler deploy --var KEY:VALUE`. For local `wrangler dev`, put
# placeholder values in `.dev.vars` (see .dev.vars.example).

# ── Observability ─────────────────────────────────────────────────────────────
# MUST mirror `observability` on `cloudflare_worker` in the Terraform module
# (infrastructure/terraform/_modules/hijri-cadence-environment/worker.tf).
# Every `wrangler deploy` uploads the script, and the upload resets any
# observability setting it omits to "off". Without this table, each deploy
# disabled Workers Logs right after Terraform enabled them, and
# `terraform plan` showed drift. Change both places together.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
