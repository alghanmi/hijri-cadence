name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter @hijri-cadence/worker typecheck

      - name: Lint
        run: pnpm --filter @hijri-cadence/worker lint

      - name: Format check
        run: pnpm format:check

      - name: Test (Tier 1 only — no network)
        run: pnpm --filter @hijri-cadence/worker test

      # Exercise the deploy path end to end without credentials: bundle a
      # fictitious config with the same CLI + --define quoting the deploy
      # uses, then have wrangler build (not upload) the Worker.
      - name: Build deployable bundle (dry run)
        working-directory: worker
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/people"
          mkdir -p "$dir"
          { echo 'token: CiTokenCiTokenCiToken00'; cat ../examples/events.example.yaml; } > "$dir/ci.yaml"
          pnpm -s bundle-configs --dir "$dir" --out "$RUNNER_TEMP/configs.json"
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" \
            --define VERSION:'"0.0.0-ci"' \
            --define CONFIGS_JSON:"$(jq -Rs . < "$RUNNER_TEMP/configs.json")"
          grep -q 'CiTokenCiTokenCiToken00' "$RUNNER_TEMP/bundle/index.js"
          grep -q '0.0.0-ci' "$RUNNER_TEMP/bundle/index.js"

      # npm registry retired /security/audits/quick + /security/advisories/bulk
      # returns 410 for most pnpm builds. Keeping the step but marking
      # continue-on-error so a future pnpm release that hits the new endpoint
      # starts feeding CI without blocking PRs in the meantime. Dependabot
      # (vulnerability-alerts + automated-security-fixes) is the primary
      # signal.
      - name: Audit dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high
