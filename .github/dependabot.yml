# Monthly, grouped: one pull request per ecosystem and directory carries every
# minor and patch update; a major version arrives as its own pull request, to
# read on its own. Security updates are separate and immediate: they need
# Dependabot security updates on (Settings -> Code security) and ignore the
# schedule, the groups and the update-types rules below.
version: 2
updates:
  # Dependabot for pnpm workspaces: a single entry at `/` scans every
  # workspace listed in pnpm-workspace.yaml (worker/) AND updates the root
  # pnpm-lock.yaml correctly. Adding a second entry at `/worker` opens
  # duplicate PRs AND — because it updates worker/package.json without
  # touching the root lockfile — those duplicates hard-fail CI with
  # ERR_PNPM_OUTDATED_LOCKFILE. See closed PRs #3, #8, #9, #10 for what
  # the failure mode looked like; the root entry (via the dev-dependencies
  # group in #11) shipped the same upgrades cleanly.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
      # Majors of these move together, in one pull request.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vitest is held at 4.x until @cloudflare/vitest-pool-workers supports
      # 5.x. The pool's peerDependencies still declare `vitest ^4.1.0` as of
      # 0.22.0, and running vitest 5 against it fails at worker boot with
      # `SyntaxError: Unexpected identifier 'file'` from miniflare's proxy
      # worker (vitest 5 emits module syntax the proxy can't parse). See
      # closed PR #20 for the failure signature. Revisit when
      # `npm view @cloudflare/vitest-pool-workers peerDependencies` shows
      # `vitest ^5.0.0` (or higher).
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'terraform'
    directory: '/infrastructure/terraform/_modules/hijri-cadence-environment'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(terraform)'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
